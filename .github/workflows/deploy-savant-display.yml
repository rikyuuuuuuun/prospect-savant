name: Deploy Savant display
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/build-staff-pages.mjs'
      - 'scripts/verify-live-pages.mjs'
      - '.github/workflows/deploy-savant-display.yml'
permissions:
  contents: read
concurrency:
  group: prospect-savant-daily-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate current public snapshot and display
        run: |
          npm test
          npm run validate:snapshot
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import vm from 'node:vm';
          const html = readFileSync('index.html', 'utf8');
          for (const match of html.matchAll(/<script>([\s\S]*?)<\/script>/g)) new vm.Script(match[1]);
          NODE
      - name: Stage shared-login entry and verified dashboard bundle
        run: |
          node scripts/build-staff-pages.mjs . _site
          git rev-parse HEAD > _site/display-revision.txt
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy validated display
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify actual HTTP publication
        run: node scripts/verify-live-pages.mjs .
