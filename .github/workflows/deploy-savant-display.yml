name: Deploy Savant display
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/build-staff-pages.mjs'
      - 'scripts/verify-live-pages.mjs'
      - '.github/workflows/deploy-savant-display.yml'
permissions:
  contents: read
concurrency:
  group: prospect-savant-daily-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate current public snapshot and display
        run: |
          npm test
          npm run validate:snapshot
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import vm from 'node:vm';
          const html = readFileSync('index.html', 'utf8');
          for (const match of html.matchAll(/<script>([\s\S]*?)<\/script>/g)) new vm.Script(match[1]);
          NODE
      - name: Stage shared-login entry and verified dashboard bundle
        run: |
          node scripts/build-staff-pages.mjs . _site
          git rev-parse HEAD > _site/display-revision.txt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy validated display
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify actual HTTP publication
        run: node scripts/verify-live-pages.mjs .
