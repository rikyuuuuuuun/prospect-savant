name: Read-only Savant production preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/read-only-savant-preflight.yml'
      - 'scripts/fetch-private-savant-source.mjs'
      - 'scripts/source-member-readback.mjs'
      - 'scripts/source-freshness-gate.mjs'
      - 'scripts/publish-private-savant-source.mjs'
permissions:
  contents: read
jobs:
  preflight:
    # Dependabot PRs do not receive repository secrets, so a live read-only capture cannot run there.
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Three independent live read-only captures and candidate validations
        env:
          SAVANT_SPREADSHEET_ID: ${{ secrets.SAVANT_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PROSPECT_TRIAL_SHEET_IDS_JSON: ${{ secrets.PROSPECT_TRIAL_SHEET_IDS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            node scripts/fetch-private-savant-source.mjs .private/savant-source.json
            node --input-type=module -e "import {readFileSync} from 'node:fs'; import {evaluateSourceFreshness} from './scripts/source-freshness-gate.mjs'; const r=evaluateSourceFreshness(JSON.parse(readFileSync('.private/savant-source.json'))); if(!r.ready) throw Error(r.errorCode || 'SOURCE_NOT_READY');"
            node scripts/publish-private-savant-with-explanations.mjs .private/savant-source.json .
            npm test
            npm run validate:snapshot
            echo "Live read-only preflight ${pass}/3 passed" >> "$GITHUB_STEP_SUMMARY"
            rm -rf .private
            # Space independent captures below the service-account per-minute read quota.
            if [ "$pass" -lt 3 ]; then sleep 35; fi
          done
      - name: Destroy private source files
        if: always()
        run: rm -rf .private
