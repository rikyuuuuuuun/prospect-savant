name: Recover Prospect Savant Daily Publish

on:
  push:
    branches:
      - main
      # PR/mergeなしのGPT pulse。mainとの差分がtrigger file 1件の場合だけRecoveryを起動する。
      - 'automation/savant-recovery-*'
    paths:
      - '.github/workflows/daily-savant-recovery.yml'
      # GPT監視がGitHub schedulerに依存せずRecoveryを起動するための軽量pulse。
      - '.github/savant-recovery-trigger'
  schedule:
    # Independent watchdog after the primary/fallback window. Avoid top-of-hour load.
    - cron: '40 9 * * *'
      timezone: Asia/Tokyo
    - cron: '20 12 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:
    inputs:
      force:
        description: 'Republish a corrected source even when today is already published'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: prospect-savant-daily-recovery
  cancel-in-progress: false

jobs:
  recover-if-stale:
    name: Dispatch and verify publisher when stale
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify pulse branch contains only the trigger change
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { validatePulseBranch } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/recovery-watchdog.mjs`);
            const { data } = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner, repo: context.repo.repo, basehead: `main...${context.sha}`,
            });
            validatePulseBranch({ ref: context.ref, changedFiles: (data.files || []).map(f => f.filename) });
            await core.summary.addRaw(`Pulse branch verified: ${context.ref.replace('refs/heads/', '')}\n`).write();
      - id: freshness
        name: Compare public snapshot with Tokyo date
        shell: bash
        env:
          FORCE_RECOVERY: ${{ inputs.force == true }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises';

          const manifest = JSON.parse(await readFile('snapshot-manifest.json', 'utf8'));
          const current = String(manifest?.asOf || '');
          if (!/^\d{4}-\d{2}-\d{2}$/.test(current)) throw new Error('PUBLIC_SNAPSHOT_ASOF_INVALID');

          const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
          }).formatToParts(new Date());
          const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
          const target = `${values.year}-${values.month}-${values.day}`;

          if (current > target) throw new Error('PUBLIC_SNAPSHOT_FUTURE_ASOF');
          const { needsRecovery: evaluateRecovery } = await import('./scripts/recovery-watchdog.mjs');
          const forceRecovery = process.env.FORCE_RECOVERY === 'true';
          let needsRecovery = evaluateRecovery({ currentAsOf: current, targetDate: target, force: forceRecovery });
          if (!needsRecovery) {
            const { verifyLivePages } = await import('./scripts/verify-live-pages.mjs');
            try { await verifyLivePages({ root: '.', expectedAsOf: target, attempts: 2 }); }
            catch { needsRecovery = true; }
          }
          await appendFile(process.env.GITHUB_OUTPUT, `needs_recovery=${needsRecovery}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `force_recovery=${forceRecovery}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `target_date=${target}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `current_as_of=${current}\n`);
          await appendFile(process.env.GITHUB_STEP_SUMMARY, [
            '## Daily Savant recovery watchdog',
            `targetDate: ${target}`,
            `currentPublishedAsOf: ${current}`,
            `forceRecovery: ${forceRecovery}`,
            `action: ${needsRecovery ? 'dispatch-publisher' : 'no-op-current'}`,
            '',
          ].join('\n'));
          NODE
      - name: Dispatch the canonical publisher
        if: steps.freshness.outputs.needs_recovery == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { waitForRecovery } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/recovery-watchdog.mjs`);
            const requestId = `${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'daily-savant-publish.yml',
              ref: 'main',
              inputs: { publish: true, recovery_request_id: requestId },
            });
            const run = await waitForRecovery({
              requestId,
              listRuns: async () => (await github.rest.actions.listWorkflowRuns({ owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'daily-savant-publish.yml', event: 'workflow_dispatch', per_page: 50 })).data.workflow_runs,
              sleep: ms => new Promise(resolve => setTimeout(resolve, ms)),
            });
            const response = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: 'snapshot-manifest.json', ref: 'main' });
            const published = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
            const { tokyoDate } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/daily-publication-gate.mjs`);
            if (published.asOf !== tokyoDate()) throw new Error('RECOVERY_PUBLICATION_STILL_STALE');
            await core.summary.addRaw(`Publisher verified: ${run.html_url}\nPublished asOf: ${published.asOf}\n`).write();
      - name: Verify the live result, including unchanged-snapshot redeploys
        run: |
          git pull --ff-only origin main
          EXPECTED_AS_OF='${{ steps.freshness.outputs.target_date }}' node scripts/verify-live-pages.mjs .
      - name: Record recovery decision
        if: always()
        shell: bash
        run: |
          echo 'targetDate: ${{ steps.freshness.outputs.target_date }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'currentPublishedAsOf: ${{ steps.freshness.outputs.current_as_of }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'forceRecovery: ${{ steps.freshness.outputs.force_recovery }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'publisherDispatch: ${{ steps.freshness.outputs.needs_recovery == 'true' && 'requested' || 'not-needed' }}' >> "$GITHUB_STEP_SUMMARY"

  cleanup-pulse-branch:
    name: Delete the consumed pulse branch
    needs: recover-if-stale
    # 失敗時は調査用にbranchを残す。成功時だけ、検証済みpatternのbranchを削除する。
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/automation/savant-recovery-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            if (!/^refs\/heads\/automation\/savant-recovery-[0-9A-Za-z._-]{1,80}$/.test(context.ref)) throw new Error('PULSE_BRANCH_REF_INVALID');
            await github.rest.git.deleteRef({ owner: context.repo.owner, repo: context.repo.repo, ref: context.ref.replace('refs/', '') });
