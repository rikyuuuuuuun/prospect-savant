name: Refresh portal daily snapshots

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-portal-snapshot.yml'
  workflow_run:
    workflows: ['Publish Prospect Savant', 'Deploy Savant display']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: daily-portal-project-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scope: ${{ fromJSON(github.event_name == 'workflow_run' && '["savant"]' || '["projects","portal","trials","savant"]') }}
    permissions:
      id-token: write
    steps:
      - name: Refresh saved data
        shell: bash
        env:
          SNAPSHOT_SCOPE: ${{ matrix.scope }}
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://prospect-portal.rikuhirata713.chatgpt.site';
          const paths = {
            projects: '/api/internal/project-refresh',
            portal: '/api/internal/portal-refresh',
            trials: '/api/internal/savant-refresh',
            savant: '/api/internal/savant-bundle-refresh',
          };
          const scope = process.env.SNAPSHOT_SCOPE;
          if (!Object.hasOwn(paths, scope)) throw new Error('invalid_scope');
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set('audience', origin + '/daily-projects');
          for (let attempt = 0; attempt < 4; attempt++) {
            try {
              const identityResponse = await fetch(tokenUrl, {
                headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN },
                signal: AbortSignal.timeout(15000),
              });
              if (!identityResponse.ok) throw new Error('identity_unavailable');
              const identity = await identityResponse.json();
              if (typeof identity.value !== 'string') throw new Error('identity_invalid');
              const response = await fetch(origin + paths[scope], {
                method: 'POST',
                headers: { Authorization: 'Bearer ' + identity.value },
                signal: AbortSignal.timeout(75000),
                redirect: 'error',
              });
              if (response.status === 401 || response.status === 403) {
                console.error('Refresh authentication failed.');
                process.exit(1);
              }
              if (!response.ok) throw new Error('refresh_unavailable');
              const result = await response.json();
              if (!(scope === 'trials' ? result.status === 'ready' : ['updated', 'already_current'].includes(result.status))) throw new Error('refresh_incomplete');
              console.log('Saved snapshot refresh completed: ' + scope);
              process.exit(0);
            } catch {
              if (attempt === 3) {
                console.error('Refresh failed; previous saved data is retained: ' + scope);
                process.exit(1);
              }
              await new Promise(resolve => setTimeout(resolve, [15000, 30000, 60000][attempt]));
            }
          }
          NODE
