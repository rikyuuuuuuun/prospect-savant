name: Publish Prospect Savant
run-name: ${{ inputs.recovery_request_id && format('Savant recovery {0}', inputs.recovery_request_id) || 'Publish Prospect Savant' }}

on:
  schedule:
    # Early slot: GitHub delays scheduled runs (~2h observed), so start early and wait for the source.
    - cron: '7 6 * * *'
      timezone: Asia/Tokyo
    # GitHub Actions supports timezone-aware schedules. 07:30 JST every day.
    - cron: '30 7 * * *'
      timezone: Asia/Tokyo
    # Primary eventがdelay/dropした場合だけを補う。開始時gateで同日二重公開を防ぐ。
    - cron: '45 8 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:
    inputs:
      recovery_request_id:
        description: 'Recovery correlation ID (watchdog only)'
        required: false
        type: string
      publish:
        description: 'mainへcommitし、Pagesへ配備する（既定はdry-run）'
        required: false
        type: boolean
        default: false

concurrency:
  group: prospect-savant-daily-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Read-only source to verified public artifact
    runs-on: ubuntu-latest
    # Includes a bounded wait (SOURCE_WAIT_MINUTES) for upstream member sync readiness.
    timeout-minutes: 80
    outputs:
      current: ${{ steps.candidate.outputs.candidate_is_current == 'true' || steps.daily-gate.outputs.action == 'skipped-already-current' }}
      target_date: ${{ steps.daily-gate.outputs.target_date }}
      changed: ${{ steps.changes.outputs.changed || 'false' }}
      candidate_as_of: ${{ steps.candidate.outputs.candidate_as_of || steps.source-freshness.outputs.source_as_of }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 遅延したschedule runも開始時の最新mainを判定する。manual dispatchのrefは従来どおり維持する。
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
          fetch-depth: 50
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - id: daily-gate
        name: Evaluate daily publication idempotency gate
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/daily-publication-gate.mjs snapshot-manifest.json
      - name: Validate required secrets without displaying values
        if: steps.daily-gate.outputs.should_fetch_source == 'true'
        shell: bash
        env:
          SAVANT_SPREADSHEET_ID: ${{ secrets.SAVANT_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PROSPECT_TRIAL_SHEET_IDS_JSON: ${{ secrets.PROSPECT_TRIAL_SHEET_IDS_JSON }}
        run: |
          test -n "$SAVANT_SPREADSHEET_ID" || { echo 'Missing SAVANT_SPREADSHEET_ID'; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo 'Missing GOOGLE_SERVICE_ACCOUNT_JSON'; exit 1; }
          test -n "$PROSPECT_TRIAL_SHEET_IDS_JSON" || { echo 'Missing PROSPECT_TRIAL_SHEET_IDS_JSON'; exit 1; }
      - id: source-freshness
        name: Fetch anonymous aggregates, waiting (bounded) for source readiness
        if: steps.daily-gate.outputs.should_fetch_source == 'true'
        shell: bash
        env:
          SAVANT_SPREADSHEET_ID: ${{ secrets.SAVANT_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PROSPECT_TRIAL_SHEET_IDS_JSON: ${{ secrets.PROSPECT_TRIAL_SHEET_IDS_JSON }}
          TARGET_DATE: ${{ steps.daily-gate.outputs.target_date }}
          GATE_TRIGGER: ${{ steps.daily-gate.outputs.trigger }}
          # Scheduled and watchdog runs wait for upstream; manual diagnostics do not.
          SOURCE_WAIT_MINUTES: ${{ (github.event_name == 'schedule' || inputs.recovery_request_id != '') && '60' || '0' }}
        run: |
          set -euo pipefail
          node scripts/wait-private-savant-source.mjs .private/savant-source.json
          node scripts/source-freshness-gate.mjs .private/savant-source.json
      - name: Generate and validate a complete candidate snapshot
        if: steps.daily-gate.outputs.should_fetch_source == 'true' && steps.source-freshness.outputs.source_is_current == 'true'
        shell: bash
        run: |
          # dry-runも同じ候補を生成する。コミット・Pages配備の有無だけを後段で分ける。
          node scripts/publish-private-savant-with-explanations.mjs .private/savant-source.json .
          npm test
          npm run validate:snapshot
          node --check data.js
          node --check event-data.js
          node --check retention-data.js
          node --check school-age-data.js
          node --check trial-data.js
      - id: candidate
        name: Verify generated candidate freshness
        if: steps.daily-gate.outputs.should_fetch_source == 'true' && steps.source-freshness.outputs.source_is_current == 'true'
        shell: bash
        env:
          TARGET_DATE: ${{ steps.daily-gate.outputs.target_date }}
          SOURCE_AS_OF: ${{ steps.source-freshness.outputs.source_as_of }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('snapshot-manifest.json', 'utf8'));
          if (manifest.asOf !== process.env.SOURCE_AS_OF || manifest.asOf !== process.env.TARGET_DATE) {
            throw new Error('CANDIDATE_ASOF_TARGET_DATE_MISMATCH');
          }
          await appendFile(process.env.GITHUB_OUTPUT, `candidate_as_of=${manifest.asOf}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, 'candidate_is_current=true\n');
          NODE
      - id: changes
        name: Detect a changed public snapshot only
        if: steps.daily-gate.outputs.should_fetch_source == 'true' && steps.candidate.outputs.candidate_is_current == 'true'
        shell: bash
        run: |
          files=(data.js event-data.js retention-data.js school-age-data.js snapshot-manifest.json trial-data.js trial-manifest.json)
          if git diff --quiet -- "${files[@]}"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Record candidate change decision
        if: steps.daily-gate.outputs.should_fetch_source == 'true'
        shell: bash
        run: |
          echo '## Daily Savant candidate decision' >> "$GITHUB_STEP_SUMMARY"
          echo 'candidateAsOf: ${{ steps.candidate.outputs.candidate_as_of || steps.source-freshness.outputs.source_as_of }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'candidateIsCurrent: ${{ steps.source-freshness.outputs.source_is_current }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'changed: ${{ steps.changes.outputs.changed }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Record the anonymous trial candidate summary
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFile } from 'node:fs/promises';
          import { parseFrozenJson } from './scripts/trial-publication.mjs';
          const trial = parseFrozenJson(await readFile('trial-data.js', 'utf8'), 'trial-data.js');
          const daily = trial?.today;
          const annualC = trial?.annual?.teams?.C;
          const ids = ['A', 'B', 'C', 'D'];
          if (daily?.status !== 'ok' || !annualC || !ids.every((id) => Number.isSafeInteger(daily?.teams?.[id]))) throw new Error('TRIAL_PUBLIC_SUMMARY_INVALID');
          const total = ids.reduce((sum, id) => sum + daily.teams[id], 0);
          if (daily.total !== total || !Number.isSafeInteger(annualC.admissions) || !Number.isSafeInteger(annualC.trials)) throw new Error('TRIAL_PUBLIC_SUMMARY_INVALID');
          console.log('## 匿名体験候補の確認');
          console.log(`status: ok / A: ${daily.teams.A} / B: ${daily.teams.B} / C: ${daily.teams.C} / D: ${daily.teams.D} / 合計: ${total}`);
          console.log(`C年度: ${annualC.admissions} / ${annualC.trials}`);
          NODE
      - name: Upload only the verified public files
        if: steps.daily-gate.outputs.should_fetch_source == 'true' && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: savant-public-snapshot
          if-no-files-found: error
          path: |
            data.js
            event-data.js
            retention-data.js
            school-age-data.js
            snapshot-manifest.json
            trial-data.js
            trial-manifest.json
      - name: Destroy private source files
        if: always()
        shell: bash
        run: rm -rf .private

  publish-and-deploy:
    name: Commit verified snapshot and deploy Pages with recovery
    needs: prepare
    if: >-
      (needs.prepare.outputs.changed == 'true' || (inputs.publish == true && needs.prepare.outputs.current == 'true')) &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    # 初回配備失敗後の復旧配備まで完了させる時間を確保する。
    timeout-minutes: 35
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Download the verified public snapshot
        if: needs.prepare.outputs.changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: savant-public-snapshot
          path: .
      - name: Revalidate exactly what will be committed
        if: needs.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          npm test
          npm run validate:snapshot
          for file in data.js event-data.js retention-data.js school-age-data.js trial-data.js; do node --check "$file"; done
          allowed=$'data.js\nevent-data.js\nretention-data.js\nschool-age-data.js\nsnapshot-manifest.json\ntrial-data.js\ntrial-manifest.json'
          unexpected="$(git diff --name-only | grep -vxF -f <(printf '%s\n' "$allowed") || true)"
          test -z "$unexpected" || { echo 'Unexpected changed path'; exit 1; }
      - name: Configure GitHub Pages deployment
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Stage shared-login entry and the verified candidate bundle
        run: node scripts/build-staff-pages.mjs . _site
      - name: Upload the verified Pages artifact before changing main
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages-candidate
          path: _site
      - id: commit
        name: Commit only changed public files
        if: needs.prepare.outputs.changed == 'true'
        shell: bash
        run: |
          files=(data.js event-data.js retention-data.js school-age-data.js snapshot-manifest.json trial-data.js trial-manifest.json)
          git add -- "${files[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'prospect-savant-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh anonymous Savant snapshot'
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
          echo 'committed=true' >> "$GITHUB_OUTPUT"
      - name: Deploy GitHub Pages
        id: deployment
        if: steps.commit.outputs.committed == 'true' || needs.prepare.outputs.changed == 'false'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-candidate
        continue-on-error: true
      - name: Verify actual HTTP publication
        if: steps.deployment.outcome == 'success'
        env:
          EXPECTED_AS_OF: ${{ needs.prepare.outputs.target_date }}
        run: node scripts/verify-live-pages.mjs .
      - id: rollback
        name: Restore the prior public snapshot after a failed deployment
        if: steps.deployment.outcome == 'failure' && steps.commit.outputs.committed == 'true'
        shell: bash
        run: |
          git revert --no-edit "${{ steps.commit.outputs.commit_sha }}"
          git push origin HEAD:main
          echo 'reverted=true' >> "$GITHUB_OUTPUT"
      - name: Stage restored dashboard with the shared-login entry
        if: steps.rollback.outputs.reverted == 'true'
        run: node scripts/build-staff-pages.mjs . _site-restored
      - name: Upload restored Pages artifact
        if: steps.rollback.outputs.reverted == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: github-pages-restored
          path: _site-restored
      - id: restored-deployment
        name: Restore the prior GitHub Pages deployment
        if: steps.rollback.outputs.reverted == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-restored
        continue-on-error: true
      - name: Fail after recovery from a Pages deployment error
        if: steps.deployment.outcome == 'failure'
        shell: bash
        run: |
          test '${{ steps.rollback.outputs.reverted }}' = 'true' || { echo 'Pages deployment failed before recovery'; exit 1; }
          test '${{ steps.restored-deployment.outcome }}' = 'success' || { echo 'Prior Pages deployment could not be restored'; exit 1; }
          echo 'Pages deployment failed; the public snapshot commit and Pages deployment were restored.'
          exit 1
      - name: Record safe publish completion
        if: always()
        shell: bash
        run: |
          echo '## Daily Savant publish completion' >> "$GITHUB_STEP_SUMMARY"
          echo 'candidateAsOf: ${{ needs.prepare.outputs.candidate_as_of }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'changed: ${{ needs.prepare.outputs.changed }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'commit: ${{ steps.commit.outputs.commit_sha || 'none' }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'deploy: ${{ steps.deployment.outcome || 'not-run' }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'recovery: ${{ steps.rollback.outputs.reverted || 'not-needed' }}' >> "$GITHUB_STEP_SUMMARY"


  verify-current-pages:
    name: Verify current Pages even when generation is skipped
    needs: [prepare, publish-and-deploy]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.current == 'true' &&
      needs.publish-and-deploy.result == 'skipped' &&
      github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify current live files and UI bundle
        env:
          EXPECTED_AS_OF: ${{ needs.prepare.outputs.target_date }}
        run: node scripts/verify-live-pages.mjs .
